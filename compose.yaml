services:
  planner:
    build:
      context: .
      dockerfile: docker/planner.Dockerfile
    image: rocobrick-planner:humble
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
      - /root/.ros
    environment:
      ROS_LOCALHOST_ONLY: "1"
      LC_NUMERIC: C.UTF-8
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/50051'"]
      interval: 2s
      timeout: 2s
      retries: 90
    stop_grace_period: 10s
