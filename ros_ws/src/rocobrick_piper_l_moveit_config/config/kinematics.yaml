# Adapted from the pinned vendor reference
# isaac/vendor/agx_arm_sim/Moveit2/piper_l_gripper_moveit_config/config/kinematics.yaml.
# R5.A addition: the arm_tcp entry below mirrors the arm entry exactly
# (same solver, search resolution, and timeout, copied verbatim) so the
# project-calibrated TCP chain group can solve pose goals. The vendor
# arm and gripper entries are preserved unchanged.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
gripper:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
arm_tcp:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
