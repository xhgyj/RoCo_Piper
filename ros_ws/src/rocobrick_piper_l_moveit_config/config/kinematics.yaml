# Adapted from the pinned vendor reference
# isaac/vendor/agx_arm_sim/Moveit2/piper_l_gripper_moveit_config/config/kinematics.yaml.
# R5.A addition: the arm_tcp entry below mirrors the arm entry (same solver
# and search resolution) EXCEPT kinematics_solver_timeout, which is raised to
# 0.05 s: MoveIt's constrained goal sampler spends exactly this budget per
# KDL call, and 5 ms leaves too few internal restarts for narrow IK basins
# near joint limits (live evidence: the task-c-top-offset7 support pose was
# provably reachable offline yet the constrained sampler produced zero goal
# states in the 23 s planning window). The vendor arm and gripper entries are
# preserved unchanged.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
gripper:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
arm_tcp:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.05
