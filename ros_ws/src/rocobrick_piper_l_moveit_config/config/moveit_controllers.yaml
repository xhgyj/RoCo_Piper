# Adapted from the pinned vendor reference
# isaac/vendor/agx_arm_sim/Moveit2/piper_l_gripper_moveit_config/config/moveit_controllers.yaml
# (controllers, action namespaces, and joints unchanged).
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - gripper_joint1
      - gripper_joint2
