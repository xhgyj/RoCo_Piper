syntax = "proto3";
package rocobrick.planner.v1;

message Revisions { uint64 world = 1; uint64 robot_state = 2; uint64 motion = 3; }
message JointState { repeated string names = 1; repeated double positions = 2; }
message RobotState { string robot_id = 1; JointState joints = 2; string holding_part = 3; }
message Pose {
  string frame_id = 1;
  repeated double position_m = 2;
  repeated double orientation_xyzw = 3;
}
message CollisionObject {
  string object_id = 1;
  Pose pose = 2;
  enum Shape { BOX = 0; SPHERE = 1; CYLINDER = 2; }
  Shape shape = 3;
  repeated double dimensions_m = 4;
  string attached_link = 5;
}
message ContactAllowance {
  string first = 1;
  string second = 2;
  double max_force_n = 3;
  double max_penetration_m = 4;
  double max_duration_s = 5;
}
message TrajectoryPoint { repeated double positions = 1; double time_from_start_s = 2; }
message Trajectory { repeated string joint_names = 1; repeated TrajectoryPoint points = 2; }
message PlanRequest {
  string request_id = 1;
  string action = 2;
  string robot_id = 3;
  Revisions revisions = 4;
  JointState start = 5;
  Pose target = 6;
  repeated CollisionObject objects = 7;
  Trajectory other_robot_remaining_motion = 8;
  repeated ContactAllowance allowed_contacts = 9;
  repeated RobotState robots = 10;
}
message PlanResponse {
  enum Status { SUCCESS = 0; COLLISION_BLOCKED = 1; TEMPORARILY_UNREACHABLE = 2; PLANNING_FAILED = 3; INVALID_REQUEST = 4; }
  string request_id = 1;
  Status status = 2;
  Revisions revisions = 3;
  Trajectory trajectory = 4;
  repeated string required_resources = 5;
  string start_digest = 6;
  string goal_digest = 7;
  string scene_digest = 8;
  repeated string collision_report = 9;
}
message HealthRequest {}
message HealthResponse { bool ready = 1; string model_name = 2; bool trajectory_execution_enabled = 3; }
service Planner {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Plan(PlanRequest) returns (PlanResponse);
}
